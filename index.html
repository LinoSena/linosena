<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <title>Cartão de Perfil</title>

<body>

      <div class="card-body">
        <h1 class="name">Lino Sena Correia</h1>
        <p class="role">Aluno de Analise e desenvolvimento de sistemas</p>
        <p class="bio">Construindo aplicações web completas, da modelagem de dados à interface do usuário.</p>

        <div class="stats">
          <div class="stat-item">
            <strong>24</strong>
            <span>Projetos</span>
          </div>
          <div class="stat-item">
            <strong>6.7k</strong>
            <span>Seguidores</span>
          </div>
          <div class="stat-item">
            <strong>500+</strong>
            <span>Conexões</span>
          </div>
        </div>

        <div class="actions">
          <a href="https://github.com/LinoSena" target="_blank" class="btn primary">Seguir</a>
          <a href="https://mail.google.com/mail/?view=cm&fs=1&to=lino.sena06@gmail.com" target="_blank"
            class="btn secondary">Mensagem</a>
        </div>
      </div>
    </article>
  </main>

</body>

</html>
